name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          for f in plugin.json .claude-plugin/plugin.json; do
            v="v$(jq -r .version "$f")"
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "$f has $v, tag is $GITHUB_REF_NAME"; exit 1; }
          done

      - run: ./scripts/package.sh

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "Clear Head $GITHUB_REF_NAME" --generate-notes
